name: Deploy Production API

on:
  workflow_run:
    workflows: ["Go Test and Build"]
    types:
      - completed
    branches:
      - "main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/github-script@v6
        with:
          script: |
            let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            let matchArtifact = allArtifacts.data.artifacts.filter((artifact) =>{
              return artifact.name = "compiled-binary"
            })[0];
            let download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: matchArtifact.id,
              archive_format: 'zip',
            });
            let fs = require('fs');
            fs.writeFileSync(
              `${process.env.GITHUB_WORKSPACE}/compiled-binary.zip`,
              Buffer.from(download.data)
            );

      - name: Unzip Artifact
        run: unzip compiled-binary.zip

      - name: Make Binary Executable
        run: chmod +x pulse-api
      
      - name: Deploy and Run
        run: |
          echo "Connecting to production environment..."
          echo "Deploying pulse-api binary..."
          ./pulse-api &
          sleep 2
          echo "Deployment successful!"